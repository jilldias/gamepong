<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101318">
    <title>Game Pong</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
        background: #101318;
        color: #f5f5f5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        width: min(100%, 600px);
        text-align: center;
      }

      h1 {
        margin: 0 0 8px;
      }

      p {
        margin: 0 0 20px;
        color: #c3c8d1;
      }

      #game canvas {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #596170;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Game Pong</h1>
      <p>Use as setas ↑ e ↓ para movimentar sua raquete.</p>
      <div id="game"></div>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/addons/p5.sound.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/bmoren/p5.collide2D@0.7.3/p5.collide2d.min.js"></script>
    <script src="src/codegame.js"></script>
  </body>
</html>
